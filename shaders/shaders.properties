# ============================================================
# ETHERREALITY GENESIS :: CAMERA PASSES
# ============================================================

program.composite.enabled=true

program.composite1.enabled=true

# ============================================================
# ETHERREALITY GENESIS :: WATER DATA
# ============================================================

# Keep the dedicated water mask as exact data.
blend.terrain_translucent.colortex7=off

# Keep the wave normal as exact data.
blend.terrain_translucent.colortex1=off

program.deferred.enabled=true

texture.noise = texture/noises.png

# Lens wetness: 1 while underwater, fades out ~5s after leaving the water
uniform.float.lensWet = smooth(7, if(isEyeInWater == 1, 1.0, 0.0), 0.05, 5.0)

# Puddles: fill in ~4s, evaporate slowly over ~90s after rain stops
uniform.float.puddleAmt = smooth(8, rainStrength * 0.5 + thunderStrength * 0.5, 14.0, 150.0)


# Eye adaptation: slowly-tracked light level (sky light, or half of block light).
# Brightens over ~2.5s when going outside, darkens over ~6s when going into caves.
uniform.float.stormEyeForm = smooth(10, if(thunderStrength > 0.9, 1.0, 0.0), 60.0, 8.0)
uniform.float.gmFogForest = smooth(20, if(in(biome_category, CAT_FOREST, CAT_TAIGA, CAT_JUNGLE, CAT_SWAMP, CAT_MUSHROOM), 1.0, 0.0), 6.0, 6.0)
uniform.float.gmFogSea = smooth(21, if(in(biome_category, CAT_OCEAN, CAT_RIVER, CAT_BEACH, CAT_SWAMP), 1.0, 0.0), 6.0, 6.0)
uniform.float.screenRain = smooth(13, rainStrength, 2.0, 12.0)
uniform.float.netherAdapt = smooth(14, 0.05 + 0.95 * (eyeBrightness.x / 240.0) * (eyeBrightness.x / 240.0), 1.5, 5.0)
uniform.float.wxRain = smooth(11, rainStrength, 30.0, 30.0)
uniform.float.wxThunder = smooth(12, thunderStrength, 30.0, 30.0)
uniform.float.eyeAdapt = smooth(9, (0.03 + 0.97 * (eyeBrightness.y / 240.0) * (eyeBrightness.y / 240.0)) * (0.75 + 0.25 * clamp((sin(sunAngle * 6.2832) + 0.1) / 0.4, 0.0, 1.0)), 1.5, 8.0)
eyeBrightnessHalflife = 3.0


